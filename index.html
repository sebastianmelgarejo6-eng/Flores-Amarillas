<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feliz día de las flores amarillas</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(135deg, #fff176, #fbc02d);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      text-align: center;
      color: #4e342e;
      font-family: 'Segoe UI', sans-serif;
    }

    h1 {
      animation: fadeIn 2s ease-in-out;
      font-weight: 700;
      text-shadow: 2px 2px 6px rgba(0,0,0,0.2);
    }

    img {
      width: 280px;
      border-radius: 20px;
      box-shadow: 0 0 25px rgba(255,255,255,0.7);
      margin-top: 20px;
      transition: transform 0.5s ease;
    }

    img:hover {
      transform: scale(1.05);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    p {
      margin-top: 20px;
      font-size: 1.2rem;
      font-style: italic;
      color: #5d4037;
    }
  </style>
</head>
<body>
  <h1>🌼 Feliz día de las flores amarillas 🌼</h1>
  <img src="Flor.jpg" alt="Flor amarilla">
  <p>Un detalle dedicado para ti, con todo mi cariño 💛</p>
</body>
</html>
